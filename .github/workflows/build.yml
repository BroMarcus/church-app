name: Kingdom Network Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: kingdom-network-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund
      - name: Security regression tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test
      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Publish release-gate statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          publish() {
            context="$1"
            outcome="$2"
            if [ "$outcome" = "success" ]; then state=success; else state=failure; fi
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" \
              -f context="kingdom-network/${context}" \
              -f description="${context}: ${outcome}"
          }
          publish install "$INSTALL"
          publish security-tests "$TESTS"
          publish lint "$LINT"
          publish build "$BUILD"
          if [ "$INSTALL" = success ] && [ "$TESTS" = success ] && [ "$LINT" = success ] && [ "$BUILD" = success ]; then
            overall=success
            description='install, security tests, lint, and build passed'
          else
            overall=failure
            description="install=${INSTALL}, tests=${TESTS}, lint=${LINT}, build=${BUILD}"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$overall" \
            -f context='kingdom-network/release-gate' \
            -f description="$description"
      - name: Enforce release gate
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "install=$INSTALL tests=$TESTS lint=$LINT build=$BUILD"
          if [ "$INSTALL" != success ] || [ "$TESTS" != success ] || [ "$LINT" != success ] || [ "$BUILD" != success ]; then
            echo 'Release gate failed.'
            exit 1
          fi
          echo 'Release gate passed.'
